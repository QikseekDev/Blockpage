<script>
(function () {
  // Auto-detect setup for NextDNS "URL rewrite" mode.
  //
  // Under URL rewrite, the browser stays on the ORIGINAL blocked hostname —
  // your DNS just points that hostname's A/AAAA record at wherever this page
  // is hosted. So we can't read the blocked domain from a query string (there
  // isn't one); instead we ask NextDNS itself, the same way its own default
  // block page does: fire a lookup for a random *.test.nextdns.io subdomain
  // through the same resolver/network path, and NextDNS's public status
  // endpoint tells us whether the browser's last request was blocked, which
  // domain matched, and which blocklist(s) did it. No API key required —
  // this is a public, unauthenticated endpoint by design for exactly this.

  var displayDomain = window.location.hostname;

  probe(function (result) {
    if (result && result.blockPage) {
      // NextDNS returned a fully custom block-page redirect target
      var url = result.blockPage
        .replace("{domain}", encodeURIComponent(displayDomain))
        .replace("{reasons}", (result.lists || []).join(","));
      window.location.href = url;
      return;
    }

    document.body.style.display = "flex";
    setFavicon(displayDomain);

    if (!result || result.type !== "blocked") {
      // Not actually blocked (direct hit, cache, or detection failed) —
      // show a neutral "not blocked" state rather than presuming a match.
      document.getElementById("titleText").innerHTML =
        "<b>" + escapeHtml(displayDomain) + "</b> is not blocked";
      document.title = displayDomain + " — not blocked";
      document.getElementById("message").textContent =
        "This page loaded outside of a block event. If you expected a block, clear your local DNS cache and reload.";
      return;
    }

    document.getElementById("titleText").innerHTML =
      "<b>" + escapeHtml(displayDomain) + "</b> is blocked";
    document.title = displayDomain + " is blocked";
    document.getElementById("message").textContent =
      "The website you are trying to access is being blocked by whoever is in charge of the network you are connected to.";

    if (result.lists && result.lists.length) {
      fetchReasons(result.lists, function (names) {
        if (!names.length) return;
        var s = "";
        for (var i = 0; i < names.length; i++) {
          if (i > 0) s += (i === names.length - 1 ? " and " : ", ");
          s += "<b>" + escapeHtml(names[i]) + "</b>";
        }
        document.getElementById("blockedBy").innerHTML =
          "<b>" + escapeHtml(displayDomain) + "</b> is being blocked by " +
          '<span id="lists">' + s + "</span>.";
        document.getElementById("reason").style.visibility = "visible";
      });
    }
  });

  function probe(cb) {
    var token = Math.random().toString(36).slice(2, 15);
    var url = "https://" + token + ".test.nextdns.io";
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(cb)
      .catch(function (e) {
        console.error("NextDNS status probe failed", e);
        cb(null);
      });
  }

  function fetchReasons(ids, cb) {
    var q = new URLSearchParams();
    ids.forEach(function (id) { q.append("id", id); });
    q.append("locale", "en");
    fetch("https://api.nextdns.io/reasons?" + q.toString())
      .then(function (r) {
        if (!r.ok) throw new Error("reasons endpoint error: " + r.status);
        return r.json();
      })
      .then(function (json) {
        var data = json && json.data;
        if (!data || !data.length) { cb([]); return; }
        var names = [];
        data.forEach(function (item) { if (item.name) names.push(item.name); });
        cb(names);
      })
      .catch(function (e) { console.error("Failed to fetch reasons", e); cb([]); });
  }

  function setFavicon(domain) {
    var titleFavicon = document.getElementById("titleFavicon");
    var faviconUrl = "https://favicons.nextdns.io/hex:" + toHex(domain) + "@3x.png";
    var img = new Image();
    // Only swap in the real per-domain favicon if it actually loads.
    // On failure, keep the generic shield already sitting in src.
    img.onload = function () { titleFavicon.src = faviconUrl; };
    img.onerror = function () { /* keep the bright default icon as-is */ };
    img.src = faviconUrl;
  }

  function toHex(str) {
    var out = "";
    for (var i = 0; i < str.length; i++) out += str.charCodeAt(i).toString(16);
    return out;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
